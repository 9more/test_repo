name: App Churn Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - "app_churn/**"
      - ".github/workflows/app-churn-deploy.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: app-churn-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Publish Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./app_churn/backend
          push: true
          tags: ghcr.io/9more/app-churn-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app_churn/frontend
          push: true
          tags: ghcr.io/9more/app-churn-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Lightsail
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            'mkdir -p ~/app_churn'

      - name: Copy production Compose file
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            app_churn/docker-compose.prod.yml \
            "$USER@$HOST:app_churn/docker-compose.prod.yml"

      - name: Pull and deploy this commit
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "cd ~/app_churn && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans"
