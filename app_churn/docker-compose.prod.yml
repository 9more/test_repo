services:
  postgres:
    image: postgres:16
    container_name: production_ml_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ml_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the server .env file}
      POSTGRES_DB: ${DB_NAME:-ml_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/9more/app-churn-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: app_churn_backend
    restart: unless-stopped
    volumes:
      - ./models:/app/models:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ml_platform}
      DB_USER: ${DB_USER:-ml_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the server .env file}
      FLASK_DEBUG: "0"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/9more/app-churn-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: app_churn_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/deploy/app_churn/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
